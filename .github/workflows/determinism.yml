name: determinism

# `EXP-R3` needs a second host. This workflow runs the whole test suite on
# Linux, macOS and a second Windows host with the same pinned toolchain as the
# primary host, so the canonical artifact digests in
# `prototype/crates/fmp-cli/tests/determinism.rs` are compared across OSes.
# The evidence record is `research/evidence/experiments/EXP-0033-determinism.md`
# §6; a green run is the second-host observation, not a substitute for it.
#
# `HE-T20`: every host is compiled with the same `FMP_BUILD_ID` (the pull
# request head SHA, or `github.sha` on a push), so a receipt from any host names
# the same source revision instead of mixing two builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-host:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # `HE-T20`: every host compiles the same materializer and must record the
      # same build label, or the cross-host comparison would mix two builds.
      FMP_BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Record the runner host
        run: |
          rustc -Vv
          cargo -V

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update

      # `HE-T20`: all three hosts must carry a label, not only agree with each
      # other. Bash is requested because the Windows runner defaults to pwsh.
      - name: The build label is present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FMP_BUILD_ID}"
          echo "FMP_BUILD_ID=${FMP_BUILD_ID}"

      - name: Test the workspace
        working-directory: prototype
        run: cargo +1.96.0 test --workspace
